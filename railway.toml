[build]
builder = "RAILPACK"

[deploy]
# Genau ein Worker: verhindert mehrere APScheduler-Instanzen.
# Vier Threads: ausreichend für Webhook-Requests während laufendem Sync.
startCommand = "gunicorn 'server:create_app()' --workers 1 --threads 4 --bind 0.0.0.0:$PORT"

# /health wird als Deploy-Gate genutzt: Railway wartet bis zu 300s auf 200.
healthcheckPath = "/health"
healthcheckTimeout = 300

# Gunicorn ersetzt Worker nach Fehlerschwelle; Railway startet bei Master-Ausfall neu.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
